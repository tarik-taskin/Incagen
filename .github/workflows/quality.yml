name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, build and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check tracked sources for credentials
        run: npm run check:secrets

      - name: Install dependencies
        run: npm ci && npm --prefix functions ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high && npm --prefix functions audit --omit=dev --audit-level=high

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Run lint
        run: npm run lint

      - name: Run unit and component tests
        run: npm run test:run

      - name: Validate Python extraction and source contract
        run: |
          python3 -m venv python/.venv
          python/.venv/bin/python -m pip install --require-hashes -r python/requirements.lock
          npm run build:functions
          npm run test:python

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        run: npm run test:local

      - name: Run Firebase security and lifecycle tests
        run: npm run test:integration
