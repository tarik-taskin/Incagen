name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, build and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check tracked sources for credentials
        run: npm run check:secrets

      - name: Install dependencies
        run: npm ci && npm --prefix functions ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high && npm --prefix functions audit --omit=dev --audit-level=high

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Run lint
        id: lint
        run: npm run lint

      - name: Run unit and component tests
        id: unit_tests
        run: npm run test:run

      - name: Validate Python extraction and source contract
        id: python_tests
        run: |
          python3 -m venv python/.venv
          python/.venv/bin/python -m pip install --require-hashes -r python/requirements.lock
          npm run build:functions
          npm run test:python

      - name: Build production bundle
        id: build
        run: npm run build

      - name: Install Chromium
        id: chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        id: browser_tests
        run: npm run test:local

      - name: Run Firebase security and lifecycle tests
        id: integration_tests
        run: npm run test:integration

      - name: Collect sanitized failure evidence
        id: failure_evidence
        if: ${{ !cancelled() && failure() }}
        run: |
          FAILED_STEP="unknown"
          for name_pair in \
            "lint:${{ steps.lint.outcome }}" \
            "unit_tests:${{ steps.unit_tests.outcome }}" \
            "python_tests:${{ steps.python_tests.outcome }}" \
            "build:${{ steps.build.outcome }}" \
            "chromium:${{ steps.chromium.outcome }}" \
            "browser_tests:${{ steps.browser_tests.outcome }}" \
            "integration_tests:${{ steps.integration_tests.outcome }}"; do
            step_key="${name_pair%%:*}"
            step_outcome="${name_pair#*:}"
            if [ "$step_outcome" = "failure" ]; then
              FAILED_STEP="$step_key"
              break
            fi
          done
          evidence_dir="$(mktemp -d "$RUNNER_TEMP/incagen-evidence.XXXXXXXX")"
          node scripts/collect-ci-evidence.mjs \
            --failed-step "$FAILED_STEP" \
            --playwright-json test-results/playwright-report.json \
            --results-dir test-results \
            --out-dir "$evidence_dir"
          cat "$evidence_dir/summary.md" >> "$GITHUB_STEP_SUMMARY"
          echo "dir=$evidence_dir" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized failure summary and allowlisted public screenshots
        if: ${{ !cancelled() && failure() && steps.failure_evidence.outputs.dir != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-failure-evidence
          path: ${{ steps.failure_evidence.outputs.dir }}
          retention-days: 7
          if-no-files-found: ignore
