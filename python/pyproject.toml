[project]
name = "incagen-extract"
version = "0.1.0"
description = "Source-preserving extraction foundation for Incagen analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=3.0,<4",
  "pdfplumber>=0.11,<1",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
  "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "reportlab>=4,<5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
